services:
  # HAProxy HTTP Gateway
  gateway:
    build:
      context: ..
      dockerfile: test/Dockerfile.gateway
    image: test_gateway
    container_name: http-gateway
    ports:
      - "8080:8080"   # HTTP - default frontend
      - "8081:8081"   # HTTP - frontend-api
      - "8082:8082"   # HTTP - frontend-web
      - "8443:8443"   # HTTPS
      - "9090:9090"   # API/Stats
    volumes:
      - ./certs:/etc/haproxy/certs:ro
      - ./frontend-config-test.yaml:/etc/haproxy/frontend-config.yaml:ro
      - haproxy-config:/tmp/haproxy-gateway
    environment:
      - LOG_LEVEL=debug
      - FRONTEND_CONFIG_FILE=/etc/haproxy/frontend-config.yaml
    networks:
      - gateway-net
    restart: unless-stopped

  # Backend API Provider (REST API for dynamic backend discovery)
  backend-api:
    build:
      context: ..
      dockerfile: test/Dockerfile.backend-api
    image: test_backend-api
    container_name: backend-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - gateway-net
    restart: unless-stopped

  # Mock Backend Servers (HTTP/2 enabled)
  # All backend servers use the same image for faster builds
  backend-server-1:
    image: test_backend
    build:
      context: ..
      dockerfile: test/Dockerfile.backend
    container_name: backend-server-1
    environment:
      - SERVER_NAME=backend-server-1
      - SERVER_PORT=9000
      - BACKEND_NAME=api-backend
      - GATEWAY_URL=http://gateway:9090
      - ENABLE_HTTP2=true
    networks:
      - gateway-net
    depends_on:
      - gateway
    restart: unless-stopped

  backend-server-2:
    image: test_backend
    container_name: backend-server-2
    environment:
      - SERVER_NAME=backend-server-2
      - SERVER_PORT=9000
      - BACKEND_NAME=api-backend
      - GATEWAY_URL=http://gateway:9090
      - ENABLE_HTTP2=true
    networks:
      - gateway-net
    depends_on:
      - gateway
    restart: unless-stopped

  backend-server-3:
    image: test_backend
    container_name: backend-server-3
    environment:
      - SERVER_NAME=backend-server-3
      - SERVER_PORT=9000
      - BACKEND_NAME=api-backend
      - GATEWAY_URL=http://gateway:9090
      - ENABLE_HTTP2=true
    networks:
      - gateway-net
    depends_on:
      - gateway
    restart: unless-stopped

  # Web Backend Servers
  web-server-1:
    image: test_backend
    container_name: web-server-1
    environment:
      - SERVER_NAME=web-server-1
      - SERVER_PORT=9000
      - BACKEND_NAME=web-backend
      - GATEWAY_URL=http://gateway:9090
      - ENABLE_HTTP2=true
    networks:
      - gateway-net
    depends_on:
      - gateway
    restart: unless-stopped

  web-server-2:
    image: test_backend
    container_name: web-server-2
    environment:
      - SERVER_NAME=web-server-2
      - SERVER_PORT=9000
      - BACKEND_NAME=web-backend
      - GATEWAY_URL=http://gateway:9090
      - ENABLE_HTTP2=true
    networks:
      - gateway-net
    depends_on:
      - gateway
    restart: unless-stopped

  # API V2 Backend Servers (for frontend-api)
  api-v2-server-1:
    image: test_backend
    container_name: api-v2-server-1
    environment:
      - SERVER_NAME=api-v2-server-1
      - SERVER_PORT=9000
      - BACKEND_NAME=api-v2-backend
      - GATEWAY_URL=http://gateway:9090
      - FRONTEND_ID=frontend-api
      - ENABLE_HTTP2=true
    networks:
      - gateway-net
    depends_on:
      - gateway
    restart: unless-stopped

  api-v2-server-2:
    image: test_backend
    container_name: api-v2-server-2
    environment:
      - SERVER_NAME=api-v2-server-2
      - SERVER_PORT=9000
      - BACKEND_NAME=api-v2-backend
      - GATEWAY_URL=http://gateway:9090
      - FRONTEND_ID=frontend-api
      - ENABLE_HTTP2=true
    networks:
      - gateway-net
    depends_on:
      - gateway
    restart: unless-stopped

  # Web V2 Backend Servers (for frontend-web)
  web-v2-server-1:
    image: test_backend
    container_name: web-v2-server-1
    environment:
      - SERVER_NAME=web-v2-server-1
      - SERVER_PORT=9000
      - BACKEND_NAME=web-v2-backend
      - GATEWAY_URL=http://gateway:9090
      - FRONTEND_ID=frontend-web
      - ENABLE_HTTP2=true
    networks:
      - gateway-net
    depends_on:
      - gateway
    restart: unless-stopped

  web-v2-server-2:
    image: test_backend
    container_name: web-v2-server-2
    environment:
      - SERVER_NAME=web-v2-server-2
      - SERVER_PORT=9000
      - BACKEND_NAME=web-v2-backend
      - GATEWAY_URL=http://gateway:9090
      - FRONTEND_ID=frontend-web
      - ENABLE_HTTP2=true
    networks:
      - gateway-net
    depends_on:
      - gateway
    restart: unless-stopped

  # Test Client (for running tests)
  test-client:
    build:
      context: ..
      dockerfile: test/Dockerfile.test-client
    image: test_test-client
    container_name: test-client
    environment:
      - GATEWAY_URL=http://gateway:8080
      - GATEWAY_HTTPS_URL=https://gateway:8443
      - BACKEND_API_URL=http://backend-api:8000
    networks:
      - gateway-net
    depends_on:
      - gateway
    profiles:
      - testing

volumes:
  haproxy-runtime:
  haproxy-config:

networks:
  gateway-net:
    driver: bridge
