# Initial HAProxy configuration for test environment
# Frontend is statically configured here
# Backends will be registered dynamically via API

global
    master-worker
    pidfile /tmp/haproxy-gateway/haproxy.pid
    stats socket /tmp/haproxy-gateway/haproxy-runtime-api.sock mode 660 level admin expose-fd listeners
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 5s

# Static frontend configuration with HTTP/1.1 and HTTP/2 support
# Supports both HTTP/1.1 and H2C (HTTP/2 Cleartext)
frontend http-gateway
    bind :8080
    bind [::]:8080 v4v6 proto h2
    mode http
    # option http-use-htx
    # Enable HTTP/2 via ALPN negotiation (for cleartext, client must request it)
    default_backend api-backend

# Placeholder backend - will be replaced when backends register
backend api-backend
    mode http
    balance roundrobin
    http-request return status 503 content-type text/plain string "No backends available"

backend web-backend
    mode http
    balance roundrobin
    http-request return status 503 content-type text/plain string "No backends available"
