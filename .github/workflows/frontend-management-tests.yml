# Frontend Management Tests Workflow
# Automated testing for frontend management feature (Phases 1-3)

name: Frontend Management Tests
'on':
  push:
    branches:
    - master
    - main
    - develop
    paths:
    - pkg/gateway/config*.go
    - pkg/gateway/frontend_manager.go
    - pkg/gateway/enhanced_api.go
    - examples/frontend-config/**
    - test/run-frontend-test.sh
    - .github/workflows/frontend-management-tests.yml
  pull_request:
    branches:
    - master
    - main
    - develop
    paths:
    - pkg/gateway/config*.go
    - pkg/gateway/frontend_manager.go
    - pkg/gateway/enhanced_api.go
    - examples/frontend-config/**
    - test/run-frontend-test.sh
    - .github/workflows/frontend-management-tests.yml
  workflow_dispatch: null
env:
  GO_VERSION: '1.21'
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: '~/.cache/go-build

          ~/go/pkg/mod

          '
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-

          '
    - name: Run configuration tests
      id: config-tests
      run: "echo \"Running configuration unit tests...\"\ncd pkg/gateway\ngo test\
        \ -v -run TestFrontendConfig 2>&1 | tee ../../config-test-results.txt\n\n\
        if grep -q \"PASS\" ../../config-test-results.txt; then\n  echo \"\u2713 Configuration\
        \ tests passed\"\n  echo \"config_tests_passed=true\" >> $GITHUB_OUTPUT\n\
        else\n  echo \"\u2717 Configuration tests failed\"\n  echo \"config_tests_passed=false\"\
        \ >> $GITHUB_OUTPUT\n  exit 1\nfi\n"
    - name: Run all gateway unit tests
      id: gateway-tests
      run: "echo \"Running all gateway unit tests...\"\ncd pkg/gateway\ngo test -v\
        \ 2>&1 | tee ../../gateway-test-results.txt\n\nif grep -q \"PASS\" ../../gateway-test-results.txt;\
        \ then\n  echo \"\u2713 All gateway tests passed\"\n  echo \"gateway_tests_passed=true\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"\u2717 Gateway tests failed\"\n  echo\
        \ \"gateway_tests_passed=false\" >> $GITHUB_OUTPUT\n  exit 1\nfi\n"
    - name: Generate test coverage
      run: 'cd pkg/gateway

        go test -coverprofile=coverage.out

        go tool cover -func=coverage.out > coverage.txt


        echo "Test Coverage:"

        cat coverage.txt | tail -1

        '
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: 'config-test-results.txt

          gateway-test-results.txt

          pkg/gateway/coverage.txt

          '
        retention-days: 30
  config-validation:
    name: Validate Example Configurations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install yamllint
      run: 'pip install yamllint

        '
    - name: Validate YAML syntax
      id: yaml-validation
      run: "echo \"Validating example configuration files...\"\n\nFAILED=0\nfor file\
        \ in examples/frontend-config/*.yaml; do\n  echo \"Checking $file...\"\n \
        \ if yamllint -d relaxed \"$file\"; then\n    echo \"\u2713 $(basename $file)\
        \ - Valid YAML\"\n  else\n    echo \"\u2717 $(basename $file) - Invalid YAML\"\
        \n    FAILED=$((FAILED + 1))\n  fi\ndone\n\nif [ $FAILED -eq 0 ]; then\n \
        \ echo \"\u2713 All configuration files are valid\"\n  echo \"yaml_valid=true\"\
        \ >> $GITHUB_OUTPUT\nelse\n  echo \"\u2717 $FAILED configuration file(s) failed\
        \ validation\"\n  echo \"yaml_valid=false\" >> $GITHUB_OUTPUT\n  exit 1\n\
        fi\n"
    - name: Verify example files exist
      run: "echo \"Verifying all example files exist...\"\n\nREQUIRED_FILES=(\n  \"\
        examples/frontend-config/single-http-frontend.yaml\"\n  \"examples/frontend-config/http-https-frontend.yaml\"\
        \n  \"examples/frontend-config/multiple-frontends.yaml\"\n  \"examples/frontend-config/bypass-mode-frontend.yaml\"\
        \n  \"examples/frontend-config/multi-tenant.yaml\"\n  \"examples/frontend-config/README.md\"\
        \n)\n\nMISSING=0\nfor file in \"${REQUIRED_FILES[@]}\"; do\n  if [ -f \"$file\"\
        \ ]; then\n    echo \"\u2713 $file exists\"\n  else\n    echo \"\u2717 $file\
        \ missing\"\n    MISSING=$((MISSING + 1))\n  fi\ndone\n\nif [ $MISSING -gt\
        \ 0 ]; then\n  echo \"\u2717 $MISSING required file(s) missing\"\n  exit 1\n\
        fi\n\necho \"\u2713 All required files exist\"\n"
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Verify documentation exists
      run: "echo \"Checking for required documentation...\"\n\nREQUIRED_DOCS=(\n \
        \ \"FRONTEND_MANAGEMENT_DESIGN.md\"\n  \"FRONTEND_MANAGEMENT_SUMMARY.md\"\n\
        \  \"PHASE1_CONFIG_INTERFACE.md\"\n  \"FRONTEND_QUICK_REFERENCE.md\"\n  \"\
        IMPLEMENTATION_COMPLETE.md\"\n)\n\nMISSING=0\nfor doc in \"${REQUIRED_DOCS[@]}\"\
        ; do\n  if [ -f \"$doc\" ]; then\n    echo \"\u2713 $doc exists\"\n  else\n\
        \    echo \"\u2717 $doc missing\"\n    MISSING=$((MISSING + 1))\n  fi\ndone\n\
        \nif [ $MISSING -gt 0 ]; then\n  echo \"\u2717 $MISSING required documentation\
        \ file(s) missing\"\n  exit 1\nfi\n\necho \"\u2713 All required documentation\
        \ exists\"\n"
    - name: Check documentation content
      run: "echo \"Checking documentation content...\"\n\nif grep -q \"Phase 1\" FRONTEND_MANAGEMENT_DESIGN.md\
        \ && \\\n   grep -q \"Phase 2\" FRONTEND_MANAGEMENT_DESIGN.md && \\\n   grep\
        \ -q \"Phase 3\" FRONTEND_MANAGEMENT_DESIGN.md; then\n  echo \"\u2713 Design\
        \ document has all phases documented\"\nelse\n  echo \"\u2717 Design document\
        \ is incomplete\"\n  exit 1\nfi\n\nif grep -q \"ConfigProvider\" PHASE1_CONFIG_INTERFACE.md;\
        \ then\n  echo \"\u2713 Phase 1 documentation includes ConfigProvider\"\n\
        else\n  echo \"\u2717 Phase 1 documentation is incomplete\"\n  exit 1\nfi\n"
