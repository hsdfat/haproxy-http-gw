name: HTTP Gateway Tests

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'pkg/gateway/**'
      - 'cmd/http-gateway/**'
      - 'test/**'
      - 'examples/frontend-config/**'
      - '.github/workflows/gateway-tests.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'pkg/gateway/**'
      - 'cmd/http-gateway/**'
      - 'test/**'
      - 'examples/frontend-config/**'
      - '.github/workflows/gateway-tests.yml'
  workflow_dispatch:

env:
  CONTAINER_RUNTIME: podman
  COMPOSE_CMD: podman-compose
  GO_VERSION: '1.21'

jobs:
  # Unit tests for gateway components
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run configuration tests
        id: config-tests
        run: |
          echo "Running configuration unit tests..."
          cd pkg/gateway
          go test -v -run TestFrontendConfig 2>&1 | tee ../../config-test-results.txt

          if grep -q "PASS" ../../config-test-results.txt; then
            echo "✓ Configuration tests passed"
            echo "config_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Configuration tests failed"
            echo "config_tests_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run all gateway unit tests
        id: gateway-tests
        run: |
          echo "Running all gateway unit tests..."
          cd pkg/gateway
          go test -v 2>&1 | tee ../../gateway-test-results.txt

          if grep -q "PASS" ../../gateway-test-results.txt; then
            echo "✓ All gateway tests passed"
            echo "gateway_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Gateway tests failed"
            echo "gateway_tests_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Generate test coverage
        run: |
          cd pkg/gateway
          go test -coverprofile=coverage.out
          go tool cover -func=coverage.out > coverage.txt

          echo "Test Coverage:"
          cat coverage.txt | tail -1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            config-test-results.txt
            gateway-test-results.txt
            pkg/gateway/coverage.txt
          retention-days: 30

  # Configuration validation
  config-validation:
    name: Validate Configurations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML syntax
        id: yaml-validation
        run: |
          echo "Validating example configuration files..."

          FAILED=0
          for file in examples/frontend-config/*.yaml; do
            echo "Checking $file..."
            if yamllint -d relaxed "$file"; then
              echo "✓ $(basename $file) - Valid YAML"
            else
              echo "✗ $(basename $file) - Invalid YAML"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ $FAILED -eq 0 ]; then
            echo "✓ All configuration files are valid"
            echo "yaml_valid=true" >> $GITHUB_OUTPUT
          else
            echo "✗ $FAILED configuration file(s) failed validation"
            echo "yaml_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify example files exist
        run: |
          echo "Verifying all example files exist..."

          REQUIRED_FILES=(
            "examples/frontend-config/single-http-frontend.yaml"
            "examples/frontend-config/http-https-frontend.yaml"
            "examples/frontend-config/multiple-frontends.yaml"
            "examples/frontend-config/bypass-mode-frontend.yaml"
            "examples/frontend-config/multi-tenant.yaml"
            "examples/frontend-config/README.md"
          )

          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file missing"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "✗ $MISSING required file(s) missing"
            exit 1
          fi

          echo "✓ All required files exist"

  # Integration tests with Podman
  integration-tests:
    name: Integration Tests (Podman)
    runs-on: ubuntu-latest
    needs: [unit-tests, config-validation]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          # Install required tools
          sudo apt-get update
          sudo apt-get install -y jq bc

          # Podman is pre-installed on Ubuntu runners
          podman --version

          # Install podman-compose
          pip install podman-compose
          podman-compose --version

      - name: Start Podman socket
        run: |
          # Start podman socket for rootless operation
          systemctl --user start podman.socket || echo "Warning: Could not start podman socket (may not be needed)"
          systemctl --user status podman.socket --no-pager || echo "Podman socket status check skipped"

      - name: Generate SSL certificates
        run: |
          cd test
          chmod +x scripts/generate-certs.sh
          ./scripts/generate-certs.sh

      - name: Build test environment
        run: |
          cd test
          podman-compose build

      - name: Start test environment
        run: |
          cd test
          podman-compose up -d
          echo "Services started, health checks will verify readiness..."

      - name: Check service health
        run: |
          cd test
          echo "Checking service status..."
          podman-compose ps

          echo ""
          echo "Checking gateway API health..."
          for i in {1..30}; do
            if curl -sf http://localhost:9090/health > /dev/null 2>&1; then
              echo "✓ Gateway API is healthy"
              break
            fi
            echo "Attempt $i/30: Gateway API not ready yet..."
            sleep 2
          done

          if ! curl -sf http://localhost:9090/health > /dev/null 2>&1; then
            echo "✗ Gateway API failed to become healthy"
            podman-compose logs gateway
            exit 1
          fi

      - name: Wait for backend registration
        run: |
          cd test
          echo "Waiting for backend servers to register across all frontends..."

          # Poll for backend registration with timeout using frontend-scoped API
          MAX_ATTEMPTS=30
          ATTEMPT=0
          API_BACKEND_FOUND=false
          WEB_BACKEND_FOUND=false
          API_V2_BACKEND_FOUND=false
          WEB_V2_BACKEND_FOUND=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            # Check default frontend
            BACKENDS_DEFAULT=$(curl -sf http://localhost:9090/api/frontends/default/backends 2>/dev/null || echo "")
            if echo "$BACKENDS_DEFAULT" | grep -q "api-backend"; then
              API_BACKEND_FOUND=true
            fi
            if echo "$BACKENDS_DEFAULT" | grep -q "web-backend"; then
              WEB_BACKEND_FOUND=true
            fi

            # Check frontend-api
            BACKENDS_API=$(curl -sf http://localhost:9090/api/frontends/frontend-api/backends 2>/dev/null || echo "")
            if echo "$BACKENDS_API" | grep -q "api-v2-backend"; then
              API_V2_BACKEND_FOUND=true
            fi

            # Check frontend-web
            BACKENDS_WEB=$(curl -sf http://localhost:9090/api/frontends/frontend-web/backends 2>/dev/null || echo "")
            if echo "$BACKENDS_WEB" | grep -q "web-v2-backend"; then
              WEB_V2_BACKEND_FOUND=true
            fi

            if [ "$API_BACKEND_FOUND" = true ] && [ "$WEB_BACKEND_FOUND" = true ] && [ "$API_V2_BACKEND_FOUND" = true ] && [ "$WEB_V2_BACKEND_FOUND" = true ]; then
              echo "✓ All backends registered successfully across all frontends"
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Waiting for backends to register..."
            sleep 2
          done

          echo ""
          echo "Final backend status:"
          echo ""
          echo "=== Default Frontend Backends ==="
          BACKENDS=$(curl -sf http://localhost:9090/api/frontends/default/backends)
          echo "$BACKENDS" | jq '.' || echo "$BACKENDS"

          echo ""
          echo "=== Frontend-API Backends ==="
          BACKENDS=$(curl -sf http://localhost:9090/api/frontends/frontend-api/backends)
          echo "$BACKENDS" | jq '.' || echo "$BACKENDS"

          echo ""
          echo "=== Frontend-Web Backends ==="
          BACKENDS=$(curl -sf http://localhost:9090/api/frontends/frontend-web/backends)
          echo "$BACKENDS" | jq '.' || echo "$BACKENDS"

          # Validate all backends
          if [ "$API_BACKEND_FOUND" != true ]; then
            echo "✗ api-backend not found in default frontend"
            echo ""
            echo "Gateway logs:"
            podman-compose logs gateway
            echo ""
            echo "Backend server logs:"
            podman-compose logs backend-server-1 backend-server-2 backend-server-3
            exit 1
          fi

          if [ "$WEB_BACKEND_FOUND" != true ]; then
            echo "✗ web-backend not found in default frontend"
            exit 1
          fi

          if [ "$API_V2_BACKEND_FOUND" != true ]; then
            echo "✗ api-v2-backend not found in frontend-api"
            podman-compose logs api-v2-server-1 api-v2-server-2
            exit 1
          fi

          if [ "$WEB_V2_BACKEND_FOUND" != true ]; then
            echo "✗ web-v2-backend not found in frontend-web"
            podman-compose logs web-v2-server-1 web-v2-server-2
            exit 1
          fi

          echo "✓ api-backend is registered (default frontend)"
          echo "✓ web-backend is registered (default frontend)"
          echo "✓ api-v2-backend is registered (frontend-api)"
          echo "✓ web-v2-backend is registered (frontend-web)"
          echo "✓ Round-robin load balancing is ready for all frontends"

      - name: Verify backends are serving traffic
        run: |
          cd test
          echo "Waiting for HAProxy to reload with registered backends..."
          sleep 5

          echo "Verifying frontends are serving traffic..."
          for i in {1..20}; do
            # Test default frontend (8080)
            RESP=$(curl -s http://localhost:8080/ || echo "")
            if echo "$RESP" | grep -q "backend-server"; then
              echo "✓ Default frontend (8080) is serving traffic"
              break
            fi

            if [ $i -eq 20 ]; then
              echo "✗ Default frontend not serving traffic after 20 attempts"
              echo "Last response: $RESP"
              podman-compose logs gateway
              exit 1
            fi

            echo "Attempt $i/20: Waiting for backends to serve traffic..."
            sleep 3
          done

      - name: View service logs (pre-test)
        if: always()
        run: |
          cd test
          echo "=== Gateway Logs ==="
          podman-compose logs --tail=50 gateway || true
          echo ""
          echo "=== Backend Server Logs ==="
          podman-compose logs --tail=20 backend-server-1 backend-server-2 backend-server-3 || true

      - name: Run functional tests
        id: functional-tests
        run: |
          cd test
          echo "Running functional tests on all frontends (including H2C support)..."

          # Test default frontend (port 8080)
          echo ""
          echo "=== Testing Default Frontend (port 8080) ==="
          go run ./client/cmd/test-client/main.go \
            -gateway=http://localhost:8080 \
            -verbose > functional-results-default.txt 2>&1

          cat functional-results-default.txt

          if grep -q "Failed: 0" functional-results-default.txt; then
            echo "✓ Default frontend tests passed"
            DEFAULT_PASSED=true
          else
            echo "✗ Default frontend tests failed"
            DEFAULT_PASSED=false
          fi

          # Test frontend-api (port 8081)
          echo ""
          echo "=== Testing Frontend-API (port 8081) ==="
          go run ./client/cmd/test-client/main.go \
            -gateway=http://localhost:8081 \
            -verbose > functional-results-api.txt 2>&1

          cat functional-results-api.txt

          if grep -q "Failed: 0" functional-results-api.txt; then
            echo "✓ Frontend-API tests passed"
            API_PASSED=true
          else
            echo "✗ Frontend-API tests failed"
            API_PASSED=false
          fi

          # Test frontend-web (port 8082)
          echo ""
          echo "=== Testing Frontend-Web (port 8082) ==="
          go run ./client/cmd/test-client/main.go \
            -gateway=http://localhost:8082 \
            -verbose > functional-results-web.txt 2>&1

          cat functional-results-web.txt

          if grep -q "Failed: 0" functional-results-web.txt; then
            echo "✓ Frontend-Web tests passed"
            WEB_PASSED=true
          else
            echo "✗ Frontend-Web tests failed"
            WEB_PASSED=false
          fi

          # Overall result
          if [ "$DEFAULT_PASSED" = true ] && [ "$API_PASSED" = true ] && [ "$WEB_PASSED" = true ]; then
            echo "✓ All functional tests passed across all frontends"
            echo "functional_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Some functional tests failed"
            echo "functional_tests_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run HTTP/2 (H2C) performance test - Low concurrency (All Frontends)
        id: perf-test-low
        run: |
          cd test
          echo "Running HTTP/2 (H2C) low concurrency performance tests on all frontends..."

          # Test default frontend (port 8080)
          echo ""
          echo "=== Testing Default Frontend (port 8080) - Low concurrency ==="
          go run ./client/cmd/perf-client/main.go \
            -url=http://localhost:8080 \
            -http2 \
            -c=10 \
            -n=1000 > perf-low-default.txt 2>&1

          cat perf-low-default.txt

          if grep -q "Successful:" perf-low-default.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-low-default.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-low-default.txt | awk '{print $2}')

            echo "Success rate: ${SUCCESS_RATE}%"
            echo "Requests/sec: ${RPS}"

            if (( $(echo "$SUCCESS_RATE >= 99.0" | bc -l) )); then
              echo "✓ Default frontend HTTP/2 (H2C) performance test passed (${SUCCESS_RATE}%, ${RPS} req/s)"
              PERF_LOW_DEFAULT_PASSED=true
              PERF_LOW_DEFAULT_RPS=$RPS
            else
              echo "✗ Default frontend HTTP/2 (H2C) performance test failed (${SUCCESS_RATE}% < 99%)"
              PERF_LOW_DEFAULT_PASSED=false
            fi
          else
            PERF_LOW_DEFAULT_PASSED=false
          fi

          # Test frontend-api (port 8081)
          echo ""
          echo "=== Testing Frontend-API (port 8081) - Low concurrency ==="
          go run ./client/cmd/perf-client/main.go \
            -url=http://localhost:8081 \
            -http2 \
            -c=10 \
            -n=1000 > perf-low-api.txt 2>&1

          cat perf-low-api.txt

          if grep -q "Successful:" perf-low-api.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-low-api.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-low-api.txt | awk '{print $2}')

            echo "Success rate: ${SUCCESS_RATE}%"
            echo "Requests/sec: ${RPS}"

            if (( $(echo "$SUCCESS_RATE >= 99.0" | bc -l) )); then
              echo "✓ Frontend-API HTTP/2 (H2C) performance test passed (${SUCCESS_RATE}%, ${RPS} req/s)"
              PERF_LOW_API_PASSED=true
              PERF_LOW_API_RPS=$RPS
            else
              echo "✗ Frontend-API HTTP/2 (H2C) performance test failed (${SUCCESS_RATE}% < 99%)"
              PERF_LOW_API_PASSED=false
            fi
          else
            PERF_LOW_API_PASSED=false
          fi

          # Test frontend-web (port 8082)
          echo ""
          echo "=== Testing Frontend-Web (port 8082) - Low concurrency ==="
          go run ./client/cmd/perf-client/main.go \
            -url=http://localhost:8082 \
            -http2 \
            -c=10 \
            -n=1000 > perf-low-web.txt 2>&1

          cat perf-low-web.txt

          if grep -q "Successful:" perf-low-web.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-low-web.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-low-web.txt | awk '{print $2}')

            echo "Success rate: ${SUCCESS_RATE}%"
            echo "Requests/sec: ${RPS}"

            if (( $(echo "$SUCCESS_RATE >= 99.0" | bc -l) )); then
              echo "✓ Frontend-Web HTTP/2 (H2C) performance test passed (${SUCCESS_RATE}%, ${RPS} req/s)"
              PERF_LOW_WEB_PASSED=true
              PERF_LOW_WEB_RPS=$RPS
            else
              echo "✗ Frontend-Web HTTP/2 (H2C) performance test failed (${SUCCESS_RATE}% < 99%)"
              PERF_LOW_WEB_PASSED=false
            fi
          else
            PERF_LOW_WEB_PASSED=false
          fi

          # Overall result
          if [ "$PERF_LOW_DEFAULT_PASSED" = true ] && [ "$PERF_LOW_API_PASSED" = true ] && [ "$PERF_LOW_WEB_PASSED" = true ]; then
            echo "perf_low_passed=true" >> $GITHUB_OUTPUT
            echo "perf_low_default_rps=${PERF_LOW_DEFAULT_RPS}" >> $GITHUB_OUTPUT
            echo "perf_low_api_rps=${PERF_LOW_API_RPS}" >> $GITHUB_OUTPUT
            echo "perf_low_web_rps=${PERF_LOW_WEB_RPS}" >> $GITHUB_OUTPUT
          else
            echo "perf_low_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run HTTP/2 (H2C) performance test - Medium concurrency
        id: perf-test-medium
        run: |
          cd test
          echo "Running HTTP/2 (H2C) medium concurrency performance test..."
          go run ./client/cmd/perf-client/main.go \
            -url=http://localhost:8080 \
            -http2 \
            -c=50 \
            -n=5000 > perf-medium-results.txt 2>&1

          cat perf-medium-results.txt

          # Extract and validate metrics
          if grep -q "Successful:" perf-medium-results.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-medium-results.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-medium-results.txt | awk '{print $2}')

            echo "Success rate: ${SUCCESS_RATE}%"
            echo "Requests/sec: ${RPS}"

            # Validate success rate >= 98%
            if (( $(echo "$SUCCESS_RATE >= 98.0" | bc -l) )); then
              echo "✓ HTTP/2 (H2C) performance test passed (success rate: ${SUCCESS_RATE}%)"
              echo "perf_medium_passed=true" >> $GITHUB_OUTPUT
              echo "perf_medium_rps=${RPS}" >> $GITHUB_OUTPUT
            else
              echo "✗ HTTP/2 (H2C) performance test failed (success rate: ${SUCCESS_RATE}% < 98%)"
              echo "perf_medium_passed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "✗ Failed to parse performance results"
            exit 1
          fi

      - name: Run HTTP/2 (H2C) performance test - High concurrency
        id: perf-test-http2
        run: |
          cd test
          echo "Running HTTP/2 (H2C) high concurrency performance test..."
          go run ./client/cmd/perf-client/main.go \
            -url=http://localhost:8080 \
            -http2 \
            -c=50 \
            -n=5000 > perf-http2-results.txt 2>&1

          cat perf-http2-results.txt

          # Extract and validate metrics
          if grep -q "Successful:" perf-http2-results.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-http2-results.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-http2-results.txt | awk '{print $2}')

            echo "Success rate: ${SUCCESS_RATE}%"
            echo "Requests/sec: ${RPS}"

            # Validate success rate >= 98%
            if (( $(echo "$SUCCESS_RATE >= 98.0" | bc -l) )); then
              echo "✓ HTTP/2 (H2C) performance test passed (success rate: ${SUCCESS_RATE}%)"
              echo "perf_http2_passed=true" >> $GITHUB_OUTPUT
              echo "perf_http2_rps=${RPS}" >> $GITHUB_OUTPUT
            else
              echo "✗ HTTP/2 (H2C) performance test failed (success rate: ${SUCCESS_RATE}% < 98%)"
              echo "perf_http2_passed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "✗ Failed to parse performance results"
            exit 1
          fi

      - name: Test dynamic backend updates
        id: dynamic-backend-test
        run: |
          cd test
          echo "Testing dynamic backend registration API..."

          # Register a new backend via API using frontend-scoped API
          echo "Registering new backend via API to frontend 'default'..."
          RESPONSE=$(curl -sf -X POST http://localhost:9090/api/frontends/default/backends \
            -H "Content-Type: application/json" \
            -d '{
              "name": "dynamic-test-backend",
              "servers": [
                {"name": "test-srv", "ip": "backend-server-3", "port": 9000}
              ]
            }')

          echo "Response: $RESPONSE"

          # Verify response
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✓ Backend registration API successful"
          else
            echo "✗ Backend registration API failed"
            echo "dynamic_backend_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Wait for HAProxy to apply changes
          sleep 5

          # Verify backend was added
          echo "Verifying backend was added..."
          BACKENDS=$(curl -sf http://localhost:9090/api/frontends/default/backends)
          if echo "$BACKENDS" | grep -q "dynamic-test-backend"; then
            echo "✓ Dynamic backend registration successful"
            echo "dynamic_backend_passed=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Dynamic backend not found after registration"
            echo "Backends response: $BACKENDS"
            echo "dynamic_backend_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Test unregistration
          echo "Testing backend unregistration..."
          UNREG_RESPONSE=$(curl -sf -X DELETE http://localhost:9090/api/frontends/default/backends/dynamic-test-backend)
          if echo "$UNREG_RESPONSE" | grep -q '"success":true'; then
            echo "✓ Backend unregistration successful"
          else
            echo "✗ Backend unregistration failed"
            echo "Response: $UNREG_RESPONSE"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/functional-results-default.txt
            test/functional-results-api.txt
            test/functional-results-web.txt
            test/perf-low-default.txt
            test/perf-low-api.txt
            test/perf-low-web.txt
            test/perf-medium-results.txt
            test/perf-http2-results.txt
          retention-days: 30

      - name: View service logs (post-test)
        if: always()
        run: |
          cd test
          echo "=== Gateway Logs ==="
          podman-compose logs gateway || true
          echo ""
          echo "=== Default Frontend Backend Logs ==="
          podman-compose logs backend-server-1 backend-server-2 backend-server-3 || true
          echo ""
          echo "=== Default Frontend Web Server Logs ==="
          podman-compose logs web-server-1 web-server-2 || true
          echo ""
          echo "=== Frontend-API Backend Logs ==="
          podman-compose logs api-v2-server-1 api-v2-server-2 || true
          echo ""
          echo "=== Frontend-Web Backend Logs ==="
          podman-compose logs web-v2-server-1 web-v2-server-2 || true

      - name: Collect Podman stats
        if: always()
        run: |
          cd test
          echo "=== Podman Container Stats ==="
          podman stats --no-stream || true

      - name: Stop test environment
        if: always()
        run: |
          cd test
          podman-compose down -v

      - name: Generate test summary
        if: always()
        run: |
          # Calculate overall status
          FUNCTIONAL="${{ steps.functional-tests.outputs.functional_tests_passed }}"
          PERF_LOW="${{ steps.perf-test-low.outputs.perf_low_passed }}"
          PERF_MED="${{ steps.perf-test-medium.outputs.perf_medium_passed }}"
          PERF_HTTP2="${{ steps.perf-test-http2.outputs.perf_http2_passed }}"
          DYNAMIC="${{ steps.dynamic-backend-test.outputs.dynamic_backend_passed }}"

          if [ "$FUNCTIONAL" == "true" ] && [ "$PERF_LOW" == "true" ] && [ "$PERF_MED" == "true" ] && [ "$PERF_HTTP2" == "true" ] && [ "$DYNAMIC" == "true" ]; then
            OVERALL_STATUS="✅ ALL TESTS PASSED"
            OVERALL_EMOJI="🎉"
          else
            OVERALL_STATUS="❌ SOME TESTS FAILED"
            OVERALL_EMOJI="⚠️"
          fi

          # Generate comprehensive summary
          echo "# $OVERALL_EMOJI HTTP Gateway Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Overall Status:** $OVERALL_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Category | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|:------:|---------|" >> $GITHUB_STEP_SUMMARY

          # Functional tests
          if [ "${{ steps.functional-tests.outputs.functional_tests_passed }}" == "true" ]; then
            echo "| **Functional Tests** | ✅ PASS | All frontends passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Functional Tests** | ❌ FAIL | Some tests failed - check artifacts |" >> $GITHUB_STEP_SUMMARY
          fi

          # HTTP/2 (H2C) Performance test - low
          if [ "${{ steps.perf-test-low.outputs.perf_low_passed }}" == "true" ]; then
            echo "| **HTTP/2 (H2C) - Low** | ✅ PASS | 10 workers, 1,000 requests (all frontends) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **HTTP/2 (H2C) - Low** | ❌ FAIL | Success rate < 99% |" >> $GITHUB_STEP_SUMMARY
          fi

          # HTTP/2 (H2C) Performance test - medium
          if [ "${{ steps.perf-test-medium.outputs.perf_medium_passed }}" == "true" ]; then
            echo "| **HTTP/2 (H2C) - Medium** | ✅ PASS | 50 workers, 5,000 requests |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **HTTP/2 (H2C) - Medium** | ❌ FAIL | Success rate < 98% |" >> $GITHUB_STEP_SUMMARY
          fi

          # HTTP/2 (H2C) Performance test - high
          if [ "${{ steps.perf-test-http2.outputs.perf_http2_passed }}" == "true" ]; then
            echo "| **HTTP/2 (H2C) - High** | ✅ PASS | 50 workers, 5,000 requests |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **HTTP/2 (H2C) - High** | ❌ FAIL | Success rate < 98% |" >> $GITHUB_STEP_SUMMARY
          fi

          # Dynamic backend test
          if [ "${{ steps.dynamic-backend-test.outputs.dynamic_backend_passed }}" == "true" ]; then
            echo "| **Dynamic Backend** | ✅ PASS | Registration & unregistration working |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Dynamic Backend** | ❌ FAIL | Backend updates not working |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 HTTP/2 (H2C) Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Level | Frontend | Concurrency | Total Requests | Requests/sec | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|:--------:|:-----------:|:--------------:|:------------:|:------:|" >> $GITHUB_STEP_SUMMARY

          # Low concurrency - all frontends
          RPS_LOW_DEFAULT="${{ steps.perf-test-low.outputs.perf_low_default_rps }}"
          RPS_LOW_API="${{ steps.perf-test-low.outputs.perf_low_api_rps }}"
          RPS_LOW_WEB="${{ steps.perf-test-low.outputs.perf_low_web_rps }}"

          if [ -n "$RPS_LOW_DEFAULT" ]; then
            echo "| Low | Default | 10 | 1,000 | **${RPS_LOW_DEFAULT}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Low | Default | 10 | 1,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RPS_LOW_API" ]; then
            echo "| Low | API | 10 | 1,000 | **${RPS_LOW_API}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Low | API | 10 | 1,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RPS_LOW_WEB" ]; then
            echo "| Low | Web | 10 | 1,000 | **${RPS_LOW_WEB}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Low | Web | 10 | 1,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          # Medium concurrency
          RPS_MED="${{ steps.perf-test-medium.outputs.perf_medium_rps }}"
          if [ -n "$RPS_MED" ]; then
            echo "| Medium | Default | 50 | 5,000 | **${RPS_MED}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Medium | Default | 50 | 5,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          # High concurrency
          RPS_HTTP2="${{ steps.perf-test-http2.outputs.perf_http2_rps }}"
          if [ -n "$RPS_HTTP2" ]; then
            echo "| High | Default | 50 | 5,000 | **${RPS_HTTP2}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| High | Default | 50 | 5,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** All performance tests use HTTP/2 over cleartext (H2C) protocol." >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Test Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Detailed test results are available in the **Artifacts** section:" >> $GITHUB_STEP_SUMMARY
          echo "- \`functional-results-default.txt\` - Default frontend functional tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`functional-results-api.txt\` - Frontend-API functional tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`functional-results-web.txt\` - Frontend-Web functional tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-low-default.txt\` - Low concurrency (default frontend)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-low-api.txt\` - Low concurrency (frontend-api)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-low-web.txt\` - Low concurrency (frontend-web)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-medium-results.txt\` - Medium concurrency performance results" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-http2-results.txt\` - High concurrency HTTP/2 (H2C) performance results" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ℹ️ Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Runtime:** Podman" >> $GITHUB_STEP_SUMMARY
          echo "- **Go Version:** ${{ env.GO_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** \`${{ github.workflow }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const functionalPassed = '${{ steps.functional-tests.outputs.functional_tests_passed }}' === 'true';
            const perfLowPassed = '${{ steps.perf-test-low.outputs.perf_low_passed }}' === 'true';
            const perfMediumPassed = '${{ steps.perf-test-medium.outputs.perf_medium_passed }}' === 'true';
            const perfHttp2Passed = '${{ steps.perf-test-http2.outputs.perf_http2_passed }}' === 'true';
            const dynamicPassed = '${{ steps.dynamic-backend-test.outputs.dynamic_backend_passed }}' === 'true';

            const allPassed = functionalPassed && perfLowPassed && perfMediumPassed && perfHttp2Passed && dynamicPassed;

            const emoji = allPassed ? '✅' : '❌';
            const status = allPassed ? 'All tests passed!' : 'Some tests failed';

            const body = `## ${emoji} HTTP Gateway Test Results

            **Status:** ${status}

            ### Test Results

            | Test | Result |
            |------|--------|
            | Functional Tests (All Frontends) | ${functionalPassed ? '✅' : '❌'} |
            | HTTP/2 (H2C) - Low (10 workers, all frontends) | ${perfLowPassed ? '✅' : '❌'} |
            | HTTP/2 (H2C) - Medium (50 workers) | ${perfMediumPassed ? '✅' : '❌'} |
            | HTTP/2 (H2C) - High (50 workers) | ${perfHttp2Passed ? '✅' : '❌'} |
            | Dynamic Backend Updates | ${dynamicPassed ? '✅' : '❌'} |

            ### HTTP/2 (H2C) Performance Metrics

            | Test Level | Frontend | Concurrency | Total Requests | Requests/sec |
            |-----------|:--------:|:-----------:|:--------------:|:------------:|
            | Low | Default | 10 | 1,000 | ${{ steps.perf-test-low.outputs.perf_low_default_rps }} |
            | Low | API | 10 | 1,000 | ${{ steps.perf-test-low.outputs.perf_low_api_rps }} |
            | Low | Web | 10 | 1,000 | ${{ steps.perf-test-low.outputs.perf_low_web_rps }} |
            | Medium | Default | 50 | 5,000 | ${{ steps.perf-test-medium.outputs.perf_medium_rps }} |
            | High | Default | 50 | 5,000 | ${{ steps.perf-test-http2.outputs.perf_http2_rps }} |

            > **Note:** All performance tests use HTTP/2 over cleartext (H2C) protocol.

            <details>
            <summary>View detailed test results</summary>

            Test artifacts are available in the workflow run:
            - \`functional-results-default.txt\` - Default frontend tests
            - \`functional-results-api.txt\` - Frontend-API tests
            - \`functional-results-web.txt\` - Frontend-Web tests
            - \`perf-low-default.txt\` - Low concurrency (default)
            - \`perf-low-api.txt\` - Low concurrency (API)
            - \`perf-low-web.txt\` - Low concurrency (Web)
            - \`perf-medium-results.txt\` - Medium concurrency performance
            - \`perf-http2-results.txt\` - High concurrency HTTP/2 performance

            **Note:** Tests run on 3 frontends (default on port 8080, frontend-api on port 8081, frontend-web on port 8082)

            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  verify:
    name: Verify Test Results
    needs: integration-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ All HTTP Gateway tests passed successfully!"
            exit 0
          else
            echo "❌ HTTP Gateway tests failed!"
            echo "Please review the test results and fix any issues."
            exit 1
          fi
