name: HTTP Gateway Tests

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'pkg/gateway/**'
      - 'cmd/http-gateway/**'
      - 'test/**'
      - 'examples/frontend-config/**'
      - '.github/workflows/gateway-tests.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'pkg/gateway/**'
      - 'cmd/http-gateway/**'
      - 'test/**'
      - 'examples/frontend-config/**'
      - '.github/workflows/gateway-tests.yml'
  workflow_dispatch:

env:
  CONTAINER_RUNTIME: podman
  COMPOSE_CMD: podman-compose
  GO_VERSION: '1.21'

jobs:
  # Unit tests for gateway components
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run configuration tests
        id: config-tests
        run: |
          echo "Running configuration unit tests..."
          cd pkg/gateway
          go test -v -run TestFrontendConfig 2>&1 | tee ../../config-test-results.txt

          if grep -q "PASS" ../../config-test-results.txt; then
            echo "✓ Configuration tests passed"
            echo "config_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Configuration tests failed"
            echo "config_tests_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run all gateway unit tests
        id: gateway-tests
        run: |
          echo "Running all gateway unit tests..."
          cd pkg/gateway
          go test -v 2>&1 | tee ../../gateway-test-results.txt

          if grep -q "PASS" ../../gateway-test-results.txt; then
            echo "✓ All gateway tests passed"
            echo "gateway_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Gateway tests failed"
            echo "gateway_tests_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Generate test coverage
        run: |
          cd pkg/gateway
          go test -coverprofile=coverage.out
          go tool cover -func=coverage.out > coverage.txt

          echo "Test Coverage:"
          cat coverage.txt | tail -1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            config-test-results.txt
            gateway-test-results.txt
            pkg/gateway/coverage.txt
          retention-days: 30

  # Configuration validation
  config-validation:
    name: Validate Configurations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          pip install yamllint
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        id: shellcheck
        run: |
          echo "Validating test script..."
          SCRIPT="test/run-github-action-tests.sh"

          echo "Checking $SCRIPT..."
          if shellcheck -S warning "$SCRIPT"; then
            echo "✓ $(basename $SCRIPT) - Valid shell script"
            echo "shellcheck_passed=true" >> $GITHUB_OUTPUT
          else
            echo "✗ $(basename $SCRIPT) - Shellcheck found issues"
            echo "shellcheck_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Validate YAML syntax
        id: yaml-validation
        run: |
          echo "Validating example configuration files..."

          FAILED=0
          for file in examples/frontend-config/*.yaml; do
            echo "Checking $file..."
            if yamllint -d relaxed "$file"; then
              echo "✓ $(basename $file) - Valid YAML"
            else
              echo "✗ $(basename $file) - Invalid YAML"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ $FAILED -eq 0 ]; then
            echo "✓ All configuration files are valid"
            echo "yaml_valid=true" >> $GITHUB_OUTPUT
          else
            echo "✗ $FAILED configuration file(s) failed validation"
            echo "yaml_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify example files exist
        run: |
          echo "Verifying all example files exist..."

          REQUIRED_FILES=(
            "examples/frontend-config/single-http-frontend.yaml"
            "examples/frontend-config/http-https-frontend.yaml"
            "examples/frontend-config/multiple-frontends.yaml"
            "examples/frontend-config/bypass-mode-frontend.yaml"
            "examples/frontend-config/multi-tenant.yaml"
            "examples/frontend-config/README.md"
          )

          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file missing"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "✗ $MISSING required file(s) missing"
            exit 1
          fi

          echo "✓ All required files exist"

  # Integration tests with Podman
  integration-tests:
    name: Integration Tests (Podman)
    runs-on: ubuntu-latest
    needs: [unit-tests, config-validation]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup & Deploy Environment
        run: |
          set -e
          # Install dependencies
          sudo apt-get update
          sudo apt-get install -y jq bc
          podman --version
          pip install podman-compose
          podman-compose --version

          # Start Podman socket
          systemctl --user start podman.socket || echo "Warning: Could not start podman socket (may not be needed)"

          # Setup test environment
          cd test
          chmod +x scripts/generate-certs.sh
          ./scripts/generate-certs.sh
          podman-compose build
          podman-compose up -d

          # Wait for gateway health (with timeout)
          echo "Checking gateway API health..."
          HEALTH_TIMEOUT=$((SECONDS + 120))  # 2 minute timeout
          HEALTH_CHECK_PASSED=false

          for i in {1..30}; do
            if [ $SECONDS -ge $HEALTH_TIMEOUT ]; then
              echo "✗ Health check timed out after 2 minutes"
              break
            fi

            if curl -sf http://localhost:9090/health > /dev/null 2>&1; then
              echo "✓ Gateway API is healthy"
              HEALTH_CHECK_PASSED=true
              break
            fi
            echo "Attempt $i/30: Gateway API not ready yet..."
            sleep 2
          done

          if [ "$HEALTH_CHECK_PASSED" != "true" ]; then
            echo "✗ Gateway API failed to become healthy"
            echo "=== Gateway Logs ==="
            podman-compose logs gateway
            echo ""
            echo "=== Container Status ==="
            podman ps -a
            exit 1
          fi

          # Wait for backend registration (with timeout)
          echo "Waiting for backend servers to register..."
          MAX_ATTEMPTS=30
          ATTEMPT=0
          BACKEND_TIMEOUT=$((SECONDS + 180))  # 3 minute timeout
          API_BACKEND_FOUND=false
          WEB_BACKEND_FOUND=false
          API_V2_BACKEND_FOUND=false
          WEB_V2_BACKEND_FOUND=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ $SECONDS -lt $BACKEND_TIMEOUT ]; do
            BACKENDS_DEFAULT=$(curl -sf http://localhost:9090/api/frontends/default/backends 2>/dev/null || echo "")
            if echo "$BACKENDS_DEFAULT" | grep -q "api-backend"; then API_BACKEND_FOUND=true; fi
            if echo "$BACKENDS_DEFAULT" | grep -q "web-backend"; then WEB_BACKEND_FOUND=true; fi

            BACKENDS_API=$(curl -sf http://localhost:9090/api/frontends/frontend-api/backends 2>/dev/null || echo "")
            if echo "$BACKENDS_API" | grep -q "api-v2-backend"; then API_V2_BACKEND_FOUND=true; fi

            BACKENDS_WEB=$(curl -sf http://localhost:9090/api/frontends/frontend-web/backends 2>/dev/null || echo "")
            if echo "$BACKENDS_WEB" | grep -q "web-v2-backend"; then WEB_V2_BACKEND_FOUND=true; fi

            if [ "$API_BACKEND_FOUND" = true ] && [ "$WEB_BACKEND_FOUND" = true ] && [ "$API_V2_BACKEND_FOUND" = true ] && [ "$WEB_V2_BACKEND_FOUND" = true ]; then
              echo "✓ All backends registered successfully"
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Waiting for backends..."
            sleep 2
          done

          if [ "$API_BACKEND_FOUND" != true ] || [ "$WEB_BACKEND_FOUND" != true ] || [ "$API_V2_BACKEND_FOUND" != true ] || [ "$WEB_V2_BACKEND_FOUND" != true ]; then
            echo "✗ Some backends failed to register"
            echo "Backend Registration Status:"
            echo "  - api-backend (default): $API_BACKEND_FOUND"
            echo "  - web-backend (default): $WEB_BACKEND_FOUND"
            echo "  - api-v2-backend (frontend-api): $API_V2_BACKEND_FOUND"
            echo "  - web-v2-backend (frontend-web): $WEB_V2_BACKEND_FOUND"
            echo ""
            echo "=== Gateway Logs ==="
            podman-compose logs gateway
            echo ""
            echo "=== Backend Server Logs ==="
            podman-compose logs backend-server-1 backend-server-2 backend-server-3 || true
            podman-compose logs api-v2-server-1 api-v2-server-2 || true
            podman-compose logs web-v2-server-1 web-v2-server-2 || true
            exit 1
          fi

          # Configure routing rules
          chmod +x scripts/configure-routes.sh
          ./scripts/configure-routes.sh

          # Verify backends are serving traffic
          sleep 5
          for i in {1..20}; do
            RESP=$(curl -s http://localhost:8080/ || echo "")
            if echo "$RESP" | grep -q "backend-server"; then
              echo "✓ Services are ready"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "✗ Services not serving traffic"
              podman-compose logs gateway
              exit 1
            fi
            sleep 3
          done

      - name: Re-register Backends with Multiple Servers
        run: |
          set -e
          cd test

          echo "=== Re-registering backends with multiple servers ==="
          chmod +x scripts/register-all-backends.sh
          ./scripts/register-all-backends.sh
          sleep 2

          # Verify multi-server registration
          echo "Verifying multi-server backend configuration..."
          API_BACKEND_COUNT=$(curl -sf http://localhost:9090/api/frontends/default/backends 2>/dev/null | jq -r '.backends["api-backend"].Servers | length' 2>/dev/null || echo "0")
          WEB_BACKEND_COUNT=$(curl -sf http://localhost:9090/api/frontends/default/backends 2>/dev/null | jq -r '.backends["web-backend"].Servers | length' 2>/dev/null || echo "0")
          API_V2_BACKEND_COUNT=$(curl -sf http://localhost:9090/api/frontends/frontend-api/backends 2>/dev/null | jq -r '.backends["api-v2-backend"].Servers | length' 2>/dev/null || echo "0")
          WEB_V2_BACKEND_COUNT=$(curl -sf http://localhost:9090/api/frontends/frontend-web/backends 2>/dev/null | jq -r '.backends["web-v2-backend"].Servers | length' 2>/dev/null || echo "0")

          echo "Backend server counts:"
          echo "  - api-backend: $API_BACKEND_COUNT servers (expected: 3)"
          echo "  - web-backend: $WEB_BACKEND_COUNT servers (expected: 2)"
          echo "  - api-v2-backend: $API_V2_BACKEND_COUNT servers (expected: 2)"
          echo "  - web-v2-backend: $WEB_V2_BACKEND_COUNT servers (expected: 2)"

          if [ "$API_BACKEND_COUNT" -ge 2 ] && [ "$WEB_BACKEND_COUNT" -ge 2 ] && [ "$API_V2_BACKEND_COUNT" -ge 2 ] && [ "$WEB_V2_BACKEND_COUNT" -ge 2 ]; then
            echo "✓ Multi-server backends configured successfully"
          else
            echo "✗ Backend configuration incomplete"
            exit 1
          fi

      - name: Run All Tests
        id: run-tests
        run: |
          set -e
          cd test

          # Functional tests
          echo "=== Running Functional Tests ==="
          go run ./client/cmd/test-client/main.go -gateway=http://localhost:8080 -verbose > functional-results-default.txt 2>&1
          cat functional-results-default.txt
          DEFAULT_PASSED=$(grep -q "Failed: 0" functional-results-default.txt && echo "true" || echo "false")

          go run ./client/cmd/test-client/main.go -gateway=http://localhost:8081 -verbose > functional-results-api.txt 2>&1
          cat functional-results-api.txt
          API_PASSED=$(grep -q "Failed: 0" functional-results-api.txt && echo "true" || echo "false")

          go run ./client/cmd/test-client/main.go -gateway=http://localhost:8082 -verbose > functional-results-web.txt 2>&1
          cat functional-results-web.txt
          WEB_PASSED=$(grep -q "Failed: 0" functional-results-web.txt && echo "true" || echo "false")

          if [ "$DEFAULT_PASSED" = "true" ] && [ "$API_PASSED" = "true" ] && [ "$WEB_PASSED" = "true" ]; then
            echo "functional_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "functional_tests_passed=false" >> $GITHUB_OUTPUT
            echo "=== FUNCTIONAL TEST FAILURES ==="
            echo "Test Status:"
            echo "  - Default frontend (8080): $DEFAULT_PASSED"
            echo "  - API frontend (8081): $API_PASSED"
            echo "  - Web frontend (8082): $WEB_PASSED"
            echo ""
            echo "Failed test details:"
            grep -i "failed\|error" functional-results-*.txt || true
            exit 1
          fi

          # Function to get container stats
          get_container_stats() {
            local container_name=$1
            podman stats --no-stream --format "{{.MemUsage}} {{.CPUPerc}}" "$container_name" 2>/dev/null || echo "N/A N/A"
          }

          # Get the actual gateway container name (handle both http-gateway and test_gateway_1 formats)
          GATEWAY_CONTAINER=$(podman ps --format "{{.Names}}" | grep -E "gateway|http-gateway" | head -1)
          if [ -z "$GATEWAY_CONTAINER" ]; then
            GATEWAY_CONTAINER="http-gateway"
          fi
          echo "Using gateway container: $GATEWAY_CONTAINER"

          # Performance tests - Low concurrency (8 workers, 2,000 requests - all frontends in parallel)
          echo "=== Running Performance Tests - Low (All Frontends in Parallel) ==="
          STATS_BEFORE=$(get_container_stats "$GATEWAY_CONTAINER")
          echo "Resource usage before test - Memory: $(echo $STATS_BEFORE | awk '{print $1}'), CPU: $(echo $STATS_BEFORE | awk '{print $2}')"

          # Run all 3 frontends simultaneously in background
          go run ./client/cmd/perf-client/main.go -url=http://localhost:8080 -http2 -c=8 -n=2000 > perf-low-default.txt 2>&1 &
          PID_DEFAULT=$!
          go run ./client/cmd/perf-client/main.go -url=http://localhost:8081 -http2 -c=8 -n=2000 > perf-low-api.txt 2>&1 &
          PID_API=$!
          go run ./client/cmd/perf-client/main.go -url=http://localhost:8082 -http2 -c=8 -n=2000 > perf-low-web.txt 2>&1 &
          PID_WEB=$!

          # Wait for all tests to complete
          wait $PID_DEFAULT $PID_API $PID_WEB
          STATS_AFTER=$(get_container_stats "$GATEWAY_CONTAINER")
          echo "✓ All low concurrency tests completed"
          echo "Resource usage after test - Memory: $(echo $STATS_AFTER | awk '{print $1}'), CPU: $(echo $STATS_AFTER | awk '{print $2}')"

          # Display results
          echo "=== Default Frontend Results ==="
          cat perf-low-default.txt
          echo "=== API Frontend Results ==="
          cat perf-low-api.txt
          echo "=== Web Frontend Results ==="
          cat perf-low-web.txt

          # Validate results
          PERF_LOW_DEFAULT_PASSED=false
          PERF_LOW_DEFAULT_RPS=""
          if grep -q "Successful:" perf-low-default.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-low-default.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-low-default.txt | awk '{print $2}')
            if (( $(echo "$SUCCESS_RATE >= 99.0" | bc -l) )); then
              PERF_LOW_DEFAULT_PASSED=true
              PERF_LOW_DEFAULT_RPS=$RPS
            fi
          fi

          PERF_LOW_API_PASSED=false
          PERF_LOW_API_RPS=""
          if grep -q "Successful:" perf-low-api.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-low-api.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-low-api.txt | awk '{print $2}')
            if (( $(echo "$SUCCESS_RATE >= 99.0" | bc -l) )); then
              PERF_LOW_API_PASSED=true
              PERF_LOW_API_RPS=$RPS
            fi
          fi

          PERF_LOW_WEB_PASSED=false
          PERF_LOW_WEB_RPS=""
          if grep -q "Successful:" perf-low-web.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-low-web.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-low-web.txt | awk '{print $2}')
            if (( $(echo "$SUCCESS_RATE >= 99.0" | bc -l) )); then
              PERF_LOW_WEB_PASSED=true
              PERF_LOW_WEB_RPS=$RPS
            fi
          fi

          if [ "$PERF_LOW_DEFAULT_PASSED" = "true" ] && [ "$PERF_LOW_API_PASSED" = "true" ] && [ "$PERF_LOW_WEB_PASSED" = "true" ]; then
            echo "perf_low_passed=true" >> $GITHUB_OUTPUT
            echo "perf_low_default_rps=${PERF_LOW_DEFAULT_RPS}" >> $GITHUB_OUTPUT
            echo "perf_low_api_rps=${PERF_LOW_API_RPS}" >> $GITHUB_OUTPUT
            echo "perf_low_web_rps=${PERF_LOW_WEB_RPS}" >> $GITHUB_OUTPUT
          else
            echo "perf_low_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Performance tests - Medium concurrency (16 workers, 20,000 requests - all frontends in parallel)
          echo "=== Running Performance Tests - Medium (All Frontends in Parallel) ==="
          STATS_BEFORE=$(get_container_stats "$GATEWAY_CONTAINER")
          echo "Resource usage before test - Memory: $(echo $STATS_BEFORE | awk '{print $1}'), CPU: $(echo $STATS_BEFORE | awk '{print $2}')"

          # Run all 3 frontends simultaneously in background
          go run ./client/cmd/perf-client/main.go -url=http://localhost:8080 -http2 -c=16 -n=20000 > perf-medium-default.txt 2>&1 &
          PID_DEFAULT=$!
          go run ./client/cmd/perf-client/main.go -url=http://localhost:8081 -http2 -c=16 -n=20000 > perf-medium-api.txt 2>&1 &
          PID_API=$!
          go run ./client/cmd/perf-client/main.go -url=http://localhost:8082 -http2 -c=16 -n=20000 > perf-medium-web.txt 2>&1 &
          PID_WEB=$!

          # Wait for all tests to complete
          wait $PID_DEFAULT $PID_API $PID_WEB
          STATS_AFTER=$(get_container_stats "$GATEWAY_CONTAINER")
          echo "✓ All medium concurrency tests completed"
          echo "Resource usage after test - Memory: $(echo $STATS_AFTER | awk '{print $1}'), CPU: $(echo $STATS_AFTER | awk '{print $2}')"

          # Display results
          echo "=== Default Frontend Results ==="
          cat perf-medium-default.txt
          echo "=== API Frontend Results ==="
          cat perf-medium-api.txt
          echo "=== Web Frontend Results ==="
          cat perf-medium-web.txt

          # Validate results
          PERF_MEDIUM_DEFAULT_PASSED=false
          PERF_MEDIUM_DEFAULT_RPS=""
          if grep -q "Successful:" perf-medium-default.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-medium-default.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-medium-default.txt | awk '{print $2}')
            if (( $(echo "$SUCCESS_RATE >= 98.0" | bc -l) )); then
              PERF_MEDIUM_DEFAULT_PASSED=true
              PERF_MEDIUM_DEFAULT_RPS=$RPS
            fi
          fi

          PERF_MEDIUM_API_PASSED=false
          PERF_MEDIUM_API_RPS=""
          if grep -q "Successful:" perf-medium-api.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-medium-api.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-medium-api.txt | awk '{print $2}')
            if (( $(echo "$SUCCESS_RATE >= 98.0" | bc -l) )); then
              PERF_MEDIUM_API_PASSED=true
              PERF_MEDIUM_API_RPS=$RPS
            fi
          fi

          PERF_MEDIUM_WEB_PASSED=false
          PERF_MEDIUM_WEB_RPS=""
          if grep -q "Successful:" perf-medium-web.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-medium-web.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-medium-web.txt | awk '{print $2}')
            if (( $(echo "$SUCCESS_RATE >= 98.0" | bc -l) )); then
              PERF_MEDIUM_WEB_PASSED=true
              PERF_MEDIUM_WEB_RPS=$RPS
            fi
          fi

          if [ "$PERF_MEDIUM_DEFAULT_PASSED" = "true" ] && [ "$PERF_MEDIUM_API_PASSED" = "true" ] && [ "$PERF_MEDIUM_WEB_PASSED" = "true" ]; then
            echo "perf_medium_passed=true" >> $GITHUB_OUTPUT
            echo "perf_medium_default_rps=${PERF_MEDIUM_DEFAULT_RPS}" >> $GITHUB_OUTPUT
            echo "perf_medium_api_rps=${PERF_MEDIUM_API_RPS}" >> $GITHUB_OUTPUT
            echo "perf_medium_web_rps=${PERF_MEDIUM_WEB_RPS}" >> $GITHUB_OUTPUT
          else
            echo "perf_medium_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Performance tests - High concurrency (32 workers, 100,000 requests - all frontends in parallel)
          echo "=== Running Performance Tests - High (All Frontends in Parallel) ==="

          # Start continuous resource monitoring in background
          (while true; do
            podman stats --no-stream --format "{{.Name}},{{.CPUPerc}},{{.MemUsage}},{{.NetIO}},{{.BlockIO}}" "$GATEWAY_CONTAINER" 2>/dev/null || echo "$GATEWAY_CONTAINER,N/A,N/A,N/A,N/A"
            sleep 1
          done) > perf-high-monitor.csv 2>&1 &
          MONITOR_PID=$!

          STATS_BEFORE=$(get_container_stats "$GATEWAY_CONTAINER")
          echo "Resource usage before test - Memory: $(echo $STATS_BEFORE | awk '{print $1}'), CPU: $(echo $STATS_BEFORE | awk '{print $2}')"

          # Run all 3 frontends simultaneously in background
          go run ./client/cmd/perf-client/main.go -url=http://localhost:8080 -http2 -c=32 -n=100000 > perf-high-default.txt 2>&1 &
          PID_DEFAULT=$!
          go run ./client/cmd/perf-client/main.go -url=http://localhost:8081 -http2 -c=32 -n=100000 > perf-high-api.txt 2>&1 &
          PID_API=$!
          go run ./client/cmd/perf-client/main.go -url=http://localhost:8082 -http2 -c=32 -n=100000 > perf-high-web.txt 2>&1 &
          PID_WEB=$!

          # Wait for all tests to complete
          wait $PID_DEFAULT $PID_API $PID_WEB

          # Stop monitoring
          kill $MONITOR_PID 2>/dev/null || true
          wait $MONITOR_PID 2>/dev/null || true

          STATS_AFTER=$(get_container_stats "$GATEWAY_CONTAINER")
          echo "✓ All high concurrency tests completed"
          echo "Resource usage after test - Memory: $(echo $STATS_AFTER | awk '{print $1}'), CPU: $(echo $STATS_AFTER | awk '{print $2}')"

          # Display resource monitoring summary
          if [ -f perf-high-monitor.csv ]; then
            echo "=== Resource Monitoring During High Concurrency Test (Last 10 samples) ==="
            tail -10 perf-high-monitor.csv
          fi

          # Display results
          echo "=== Default Frontend Results ==="
          cat perf-high-default.txt
          echo "=== API Frontend Results ==="
          cat perf-high-api.txt
          echo "=== Web Frontend Results ==="
          cat perf-high-web.txt

          # Validate results
          PERF_HIGH_DEFAULT_PASSED=false
          PERF_HIGH_DEFAULT_RPS=""
          if grep -q "Successful:" perf-high-default.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-high-default.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-high-default.txt | awk '{print $2}')
            if (( $(echo "$SUCCESS_RATE >= 95.0" | bc -l) )); then
              PERF_HIGH_DEFAULT_PASSED=true
              PERF_HIGH_DEFAULT_RPS=$RPS
            fi
          fi

          PERF_HIGH_API_PASSED=false
          PERF_HIGH_API_RPS=""
          if grep -q "Successful:" perf-high-api.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-high-api.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-high-api.txt | awk '{print $2}')
            if (( $(echo "$SUCCESS_RATE >= 95.0" | bc -l) )); then
              PERF_HIGH_API_PASSED=true
              PERF_HIGH_API_RPS=$RPS
            fi
          fi

          PERF_HIGH_WEB_PASSED=false
          PERF_HIGH_WEB_RPS=""
          if grep -q "Successful:" perf-high-web.txt; then
            SUCCESS_RATE=$(grep "Successful:" perf-high-web.txt | awk '{print $3}' | tr -d '()%')
            RPS=$(grep "Requests/sec:" perf-high-web.txt | awk '{print $2}')
            if (( $(echo "$SUCCESS_RATE >= 95.0" | bc -l) )); then
              PERF_HIGH_WEB_PASSED=true
              PERF_HIGH_WEB_RPS=$RPS
            fi
          fi

          if [ "$PERF_HIGH_DEFAULT_PASSED" = "true" ] && [ "$PERF_HIGH_API_PASSED" = "true" ] && [ "$PERF_HIGH_WEB_PASSED" = "true" ]; then
            echo "perf_http2_passed=true" >> $GITHUB_OUTPUT
            echo "perf_high_default_rps=${PERF_HIGH_DEFAULT_RPS}" >> $GITHUB_OUTPUT
            echo "perf_high_api_rps=${PERF_HIGH_API_RPS}" >> $GITHUB_OUTPUT
            echo "perf_high_web_rps=${PERF_HIGH_WEB_RPS}" >> $GITHUB_OUTPUT
          else
            echo "perf_http2_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # h2load Performance Tests with CPU/Memory Monitoring
          echo "=== Installing and Running h2load HTTP/2 Performance Tests ==="

          # Install h2load (part of nghttp2)
          H2LOAD_AVAILABLE=false
          sudo apt-get update && sudo apt-get install -y nghttp2-client 2>&1 | grep -v "^Reading\|^Building\|^Unpacking" || true

          if command -v h2load &> /dev/null; then
            H2LOAD_AVAILABLE=true
            h2load --version

            # Function to get container stats
            get_container_stats() {
              local container_name=$1
              podman stats --no-stream --format "{{.MemUsage}} {{.CPUPerc}}" "$container_name" 2>/dev/null || echo "N/A N/A"
            }

            # Get the actual gateway container name (handle both http-gateway and test_gateway_1 formats)
            GATEWAY_CONTAINER=$(podman ps --format "{{.Names}}" | grep -E "gateway|http-gateway" | head -1)
            if [ -z "$GATEWAY_CONTAINER" ]; then
              GATEWAY_CONTAINER="http-gateway"
            fi
            echo "Using gateway container: $GATEWAY_CONTAINER"

            # Test 1: Low load baseline (1000 requests, 10 concurrent clients)
            echo "→ h2load Test 1: Low load baseline (1K req, 10 clients)"
            STATS_BEFORE=$(get_container_stats "$GATEWAY_CONTAINER")
            h2load -n 1000 -c 10 -m 10 http://localhost:8080/ > h2load-low-default.txt 2>&1 || true
            STATS_AFTER=$(get_container_stats "$GATEWAY_CONTAINER")
            echo "  Resource usage - Before: $STATS_BEFORE | After: $STATS_AFTER"

            # Extract h2load low results
            H2LOAD_LOW_RPS=$(grep -E "req/s" h2load-low-default.txt | head -1 | awk '{print $NF}' || echo "N/A")
            H2LOAD_LOW_SUCCESS=$(grep -E "requests:" h2load-low-default.txt | awk '{print $2}' | head -1 || echo "0")
            echo "h2load_low_rps=${H2LOAD_LOW_RPS}" >> $GITHUB_OUTPUT
            echo "h2load_low_success=${H2LOAD_LOW_SUCCESS}" >> $GITHUB_OUTPUT
            cat h2load-low-default.txt

            # Test 2: Medium load (10000 requests, 50 concurrent clients)
            echo "→ h2load Test 2: Medium load (10K req, 50 clients)"
            STATS_BEFORE=$(get_container_stats "$GATEWAY_CONTAINER")
            h2load -n 10000 -c 50 -m 10 http://localhost:8080/ > h2load-medium-default.txt 2>&1 || true
            STATS_AFTER=$(get_container_stats "$GATEWAY_CONTAINER")
            echo "  Resource usage - Before: $STATS_BEFORE | After: $STATS_AFTER"

            # Extract h2load medium results
            H2LOAD_MEDIUM_RPS=$(grep -E "req/s" h2load-medium-default.txt | head -1 | awk '{print $NF}' || echo "N/A")
            H2LOAD_MEDIUM_SUCCESS=$(grep -E "requests:" h2load-medium-default.txt | awk '{print $2}' | head -1 || echo "0")
            echo "h2load_medium_rps=${H2LOAD_MEDIUM_RPS}" >> $GITHUB_OUTPUT
            echo "h2load_medium_success=${H2LOAD_MEDIUM_SUCCESS}" >> $GITHUB_OUTPUT
            cat h2load-medium-default.txt

            # Test 3: High load (50000 requests, 100 concurrent clients)
            echo "→ h2load Test 3: High load (50K req, 100 clients)"
            STATS_BEFORE=$(get_container_stats "$GATEWAY_CONTAINER")
            h2load -n 50000 -c 100 -m 10 http://localhost:8080/ > h2load-high-default.txt 2>&1 || true
            STATS_AFTER=$(get_container_stats "$GATEWAY_CONTAINER")
            echo "  Resource usage - Before: $STATS_BEFORE | After: $STATS_AFTER"

            # Extract h2load high results
            H2LOAD_HIGH_RPS=$(grep -E "req/s" h2load-high-default.txt | head -1 | awk '{print $NF}' || echo "N/A")
            H2LOAD_HIGH_SUCCESS=$(grep -E "requests:" h2load-high-default.txt | awk '{print $2}' | head -1 || echo "0")
            echo "h2load_high_rps=${H2LOAD_HIGH_RPS}" >> $GITHUB_OUTPUT
            echo "h2load_high_success=${H2LOAD_HIGH_SUCCESS}" >> $GITHUB_OUTPUT
            cat h2load-high-default.txt

            # Test 4: Stress test with continuous resource monitoring
            echo "→ h2load Test 4: Stress test (100K req, 200 clients) with monitoring"

            # Start continuous monitoring in background
            (while true; do
              podman stats --no-stream --format "{{.Name}},{{.CPUPerc}},{{.MemUsage}},{{.NetIO}},{{.BlockIO}}" "$GATEWAY_CONTAINER" 2>/dev/null || echo "$GATEWAY_CONTAINER,N/A,N/A,N/A,N/A"
              sleep 1
            done) > h2load-stress-monitor.csv 2>&1 &
            MONITOR_PID=$!

            # Run stress tests on all frontends simultaneously
            echo "  Running parallel stress tests on all 3 frontends..."
            (h2load -n 100000 -c 200 -m 10 http://localhost:8080/ > h2load-stress-default.txt 2>&1 || true) &
            PID_DEFAULT=$!
            (h2load -n 100000 -c 200 -m 10 http://localhost:8081/ > h2load-stress-api.txt 2>&1 || true) &
            PID_API=$!
            (h2load -n 100000 -c 200 -m 10 http://localhost:8082/ > h2load-stress-web.txt 2>&1 || true) &
            PID_WEB=$!

            # Wait for all stress tests to complete
            wait $PID_DEFAULT $PID_API $PID_WEB

            # Stop monitoring
            kill $MONITOR_PID 2>/dev/null || true
            wait $MONITOR_PID 2>/dev/null || true

            echo "  Stress tests completed"

            # Extract stress test results
            H2LOAD_STRESS_DEFAULT_RPS=$(grep -E "req/s" h2load-stress-default.txt | head -1 | awk '{print $NF}' || echo "N/A")
            H2LOAD_STRESS_API_RPS=$(grep -E "req/s" h2load-stress-api.txt | head -1 | awk '{print $NF}' || echo "N/A")
            H2LOAD_STRESS_WEB_RPS=$(grep -E "req/s" h2load-stress-web.txt | head -1 | awk '{print $NF}' || echo "N/A")

            echo "h2load_stress_default_rps=${H2LOAD_STRESS_DEFAULT_RPS}" >> $GITHUB_OUTPUT
            echo "h2load_stress_api_rps=${H2LOAD_STRESS_API_RPS}" >> $GITHUB_OUTPUT
            echo "h2load_stress_web_rps=${H2LOAD_STRESS_WEB_RPS}" >> $GITHUB_OUTPUT

            echo "=== Stress Test Results ==="
            echo "Default Frontend:"
            cat h2load-stress-default.txt
            echo ""
            echo "API Frontend:"
            cat h2load-stress-api.txt
            echo ""
            echo "Web Frontend:"
            cat h2load-stress-web.txt
            echo ""

            # Summary of resource monitoring
            if [ -f h2load-stress-monitor.csv ]; then
              echo "=== Resource Usage During Stress Test ==="
              echo "Last 10 samples:"
              tail -10 h2load-stress-monitor.csv

              # Calculate average CPU and memory (if data available)
              if [ -s h2load-stress-monitor.csv ]; then
                AVG_CPU=$(awk -F',' 'NR>1 && $2!="N/A" {sum+=$2; count++} END {if(count>0) printf "%.2f", sum/count; else print "N/A"}' h2load-stress-monitor.csv)
                echo "  Average CPU: ${AVG_CPU}%"
                echo "h2load_avg_cpu=${AVG_CPU}" >> $GITHUB_OUTPUT
              fi
            fi

            echo "h2load_available=true" >> $GITHUB_OUTPUT
            echo "✓ h2load tests completed successfully"
          else
            echo "h2load_available=false" >> $GITHUB_OUTPUT
            echo "⚠ h2load not available - skipping h2load tests"
          fi

          # Dynamic backend test
          echo "=== Testing Dynamic Backend Updates ==="
          RESPONSE=$(curl -sf -X POST http://localhost:9090/api/frontends/default/backends \
            -H "Content-Type: application/json" \
            -d '{"name": "dynamic-test-backend", "servers": [{"name": "test-srv", "ip": "backend-server-3", "port": 9000}]}')
          if echo "$RESPONSE" | grep -q '"success":true'; then
            sleep 5
            BACKENDS=$(curl -sf http://localhost:9090/api/frontends/default/backends)
            if echo "$BACKENDS" | grep -q "dynamic-test-backend"; then
              UNREG_RESPONSE=$(curl -sf -X DELETE http://localhost:9090/api/frontends/default/backends/dynamic-test-backend)
              if echo "$UNREG_RESPONSE" | grep -q '"success":true'; then
                echo "dynamic_backend_passed=true" >> $GITHUB_OUTPUT
              else
                echo "dynamic_backend_passed=false" >> $GITHUB_OUTPUT
                exit 1
              fi
            else
              echo "dynamic_backend_passed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "dynamic_backend_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/functional-results-default.txt
            test/functional-results-api.txt
            test/functional-results-web.txt
            test/perf-low-default.txt
            test/perf-low-api.txt
            test/perf-low-web.txt
            test/perf-medium-default.txt
            test/perf-medium-api.txt
            test/perf-medium-web.txt
            test/perf-high-default.txt
            test/perf-high-api.txt
            test/perf-high-web.txt
            test/perf-high-monitor.csv
            test/h2load-low-default.txt
            test/h2load-medium-default.txt
            test/h2load-high-default.txt
            test/h2load-stress-default.txt
            test/h2load-stress-api.txt
            test/h2load-stress-web.txt
            test/h2load-stress-monitor.csv
          retention-days: 30

      - name: Report Results & Cleanup
        if: always()
        working-directory: test
        run: |
          # View logs
          echo "=== Gateway Logs ==="
          podman-compose logs gateway || true
          echo ""
          echo "=== Backend Logs ==="
          podman-compose logs backend-server-1 backend-server-2 backend-server-3 || true
          podman-compose logs api-v2-server-1 api-v2-server-2 || true
          podman-compose logs web-v2-server-1 web-v2-server-2 || true
          
          # Collect stats
          echo "=== Podman Container Stats ==="
          podman stats --no-stream || true
          
          # Calculate overall status
          FUNCTIONAL="${{ steps.run-tests.outputs.functional_tests_passed }}"
          PERF_LOW="${{ steps.run-tests.outputs.perf_low_passed }}"
          PERF_MED="${{ steps.run-tests.outputs.perf_medium_passed }}"
          PERF_HTTP2="${{ steps.run-tests.outputs.perf_http2_passed }}"
          DYNAMIC="${{ steps.run-tests.outputs.dynamic_backend_passed }}"

          if [ "$FUNCTIONAL" == "true" ] && [ "$PERF_LOW" == "true" ] && [ "$PERF_MED" == "true" ] && [ "$PERF_HTTP2" == "true" ] && [ "$DYNAMIC" == "true" ]; then
            OVERALL_STATUS="✅ ALL TESTS PASSED"
            OVERALL_EMOJI="🎉"
          else
            OVERALL_STATUS="❌ SOME TESTS FAILED"
            OVERALL_EMOJI="⚠️"
          fi

          # Generate comprehensive summary
          echo "# $OVERALL_EMOJI HTTP Gateway Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Overall Status:** $OVERALL_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Category | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|:------:|---------|" >> $GITHUB_STEP_SUMMARY

          # Functional tests
          if [ "${{ steps.run-tests.outputs.functional_tests_passed }}" == "true" ]; then
            echo "| **Functional Tests** | ✅ PASS | All frontends passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Functional Tests** | ❌ FAIL | Some tests failed - check artifacts |" >> $GITHUB_STEP_SUMMARY
          fi

          # HTTP/2 (H2C) Performance test - low
          if [ "${{ steps.run-tests.outputs.perf_low_passed }}" == "true" ]; then
            echo "| **HTTP/2 (H2C) - Low** | ✅ PASS | 8 workers, 2,000 requests (all frontends) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **HTTP/2 (H2C) - Low** | ❌ FAIL | Success rate < 99% |" >> $GITHUB_STEP_SUMMARY
          fi

          # HTTP/2 (H2C) Performance test - medium
          if [ "${{ steps.run-tests.outputs.perf_medium_passed }}" == "true" ]; then
            echo "| **HTTP/2 (H2C) - Medium** | ✅ PASS | 16 workers, 20,000 requests (all frontends) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **HTTP/2 (H2C) - Medium** | ❌ FAIL | Success rate < 98% |" >> $GITHUB_STEP_SUMMARY
          fi

          # HTTP/2 (H2C) Performance test - high
          if [ "${{ steps.run-tests.outputs.perf_http2_passed }}" == "true" ]; then
            echo "| **HTTP/2 (H2C) - High** | ✅ PASS | 32 workers, 100,000 requests (all frontends) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **HTTP/2 (H2C) - High** | ❌ FAIL | Success rate < 95% |" >> $GITHUB_STEP_SUMMARY
          fi

          # Dynamic backend test
          if [ "${{ steps.run-tests.outputs.dynamic_backend_passed }}" == "true" ]; then
            echo "| **Dynamic Backend** | ✅ PASS | Registration & unregistration working |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Dynamic Backend** | ❌ FAIL | Backend updates not working |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 HTTP/2 (H2C) Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Level | Frontend | Concurrency | Total Requests | Requests/sec | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|:--------:|:-----------:|:--------------:|:------------:|:------:|" >> $GITHUB_STEP_SUMMARY

          # Low concurrency - all frontends
          RPS_LOW_DEFAULT="${{ steps.run-tests.outputs.perf_low_default_rps }}"
          RPS_LOW_API="${{ steps.run-tests.outputs.perf_low_api_rps }}"
          RPS_LOW_WEB="${{ steps.run-tests.outputs.perf_low_web_rps }}"

          if [ -n "$RPS_LOW_DEFAULT" ]; then
            echo "| Low | Default | 8 | 2,000 | **${RPS_LOW_DEFAULT}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Low | Default | 8 | 2,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RPS_LOW_API" ]; then
            echo "| Low | API | 8 | 2,000 | **${RPS_LOW_API}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Low | API | 8 | 2,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RPS_LOW_WEB" ]; then
            echo "| Low | Web | 8 | 2,000 | **${RPS_LOW_WEB}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Low | Web | 8 | 2,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          # Medium concurrency - all frontends
          RPS_MED_DEFAULT="${{ steps.run-tests.outputs.perf_medium_default_rps }}"
          RPS_MED_API="${{ steps.run-tests.outputs.perf_medium_api_rps }}"
          RPS_MED_WEB="${{ steps.run-tests.outputs.perf_medium_web_rps }}"

          if [ -n "$RPS_MED_DEFAULT" ]; then
            echo "| Medium | Default | 16 | 20,000 | **${RPS_MED_DEFAULT}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Medium | Default | 16 | 20,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RPS_MED_API" ]; then
            echo "| Medium | API | 16 | 20,000 | **${RPS_MED_API}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Medium | API | 16 | 20,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RPS_MED_WEB" ]; then
            echo "| Medium | Web | 16 | 20,000 | **${RPS_MED_WEB}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Medium | Web | 16 | 20,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          # High concurrency - all frontends
          RPS_HIGH_DEFAULT="${{ steps.run-tests.outputs.perf_high_default_rps }}"
          RPS_HIGH_API="${{ steps.run-tests.outputs.perf_high_api_rps }}"
          RPS_HIGH_WEB="${{ steps.run-tests.outputs.perf_high_web_rps }}"

          if [ -n "$RPS_HIGH_DEFAULT" ]; then
            echo "| High | Default | 32 | 100,000 | **${RPS_HIGH_DEFAULT}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| High | Default | 32 | 100,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RPS_HIGH_API" ]; then
            echo "| High | API | 32 | 100,000 | **${RPS_HIGH_API}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| High | API | 32 | 100,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$RPS_HIGH_WEB" ]; then
            echo "| High | Web | 32 | 100,000 | **${RPS_HIGH_WEB}** | ✅ |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| High | Web | 32 | 100,000 | N/A | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** All performance tests use HTTP/2 over cleartext (H2C) protocol." >> $GITHUB_STEP_SUMMARY

          # h2load Performance Metrics
          if [ "${{ steps.run-tests.outputs.h2load_available }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ⚡ h2load HTTP/2 Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Test Level | Clients | Total Requests | Requests/sec | Successful | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|:-------:|:--------------:|:------------:|:----------:|:------:|" >> $GITHUB_STEP_SUMMARY

            # Low load
            H2_LOW_RPS="${{ steps.run-tests.outputs.h2load_low_rps }}"
            H2_LOW_SUCCESS="${{ steps.run-tests.outputs.h2load_low_success }}"
            if [ -n "$H2_LOW_RPS" ] && [ "$H2_LOW_RPS" != "N/A" ]; then
              echo "| Low | 10 | 1,000 | **${H2_LOW_RPS}** | ${H2_LOW_SUCCESS} | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Low | 10 | 1,000 | N/A | N/A | ⚠️ |" >> $GITHUB_STEP_SUMMARY
            fi

            # Medium load
            H2_MED_RPS="${{ steps.run-tests.outputs.h2load_medium_rps }}"
            H2_MED_SUCCESS="${{ steps.run-tests.outputs.h2load_medium_success }}"
            if [ -n "$H2_MED_RPS" ] && [ "$H2_MED_RPS" != "N/A" ]; then
              echo "| Medium | 50 | 10,000 | **${H2_MED_RPS}** | ${H2_MED_SUCCESS} | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Medium | 50 | 10,000 | N/A | N/A | ⚠️ |" >> $GITHUB_STEP_SUMMARY
            fi

            # High load
            H2_HIGH_RPS="${{ steps.run-tests.outputs.h2load_high_rps }}"
            H2_HIGH_SUCCESS="${{ steps.run-tests.outputs.h2load_high_success }}"
            if [ -n "$H2_HIGH_RPS" ] && [ "$H2_HIGH_RPS" != "N/A" ]; then
              echo "| High | 100 | 50,000 | **${H2_HIGH_RPS}** | ${H2_HIGH_SUCCESS} | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| High | 100 | 50,000 | N/A | N/A | ⚠️ |" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔥 Stress Test Results (All Frontends)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Frontend | Clients | Total Requests | Requests/sec | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|:--------:|:-------:|:--------------:|:------------:|:------:|" >> $GITHUB_STEP_SUMMARY

            # Stress test - default
            H2_STRESS_DEFAULT="${{ steps.run-tests.outputs.h2load_stress_default_rps }}"
            if [ -n "$H2_STRESS_DEFAULT" ] && [ "$H2_STRESS_DEFAULT" != "N/A" ]; then
              echo "| Default (8080) | 200 | 100,000 | **${H2_STRESS_DEFAULT}** | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Default (8080) | 200 | 100,000 | N/A | ⚠️ |" >> $GITHUB_STEP_SUMMARY
            fi

            # Stress test - api
            H2_STRESS_API="${{ steps.run-tests.outputs.h2load_stress_api_rps }}"
            if [ -n "$H2_STRESS_API" ] && [ "$H2_STRESS_API" != "N/A" ]; then
              echo "| API (8081) | 200 | 100,000 | **${H2_STRESS_API}** | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| API (8081) | 200 | 100,000 | N/A | ⚠️ |" >> $GITHUB_STEP_SUMMARY
            fi

            # Stress test - web
            H2_STRESS_WEB="${{ steps.run-tests.outputs.h2load_stress_web_rps }}"
            if [ -n "$H2_STRESS_WEB" ] && [ "$H2_STRESS_WEB" != "N/A" ]; then
              echo "| Web (8082) | 200 | 100,000 | **${H2_STRESS_WEB}** | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Web (8082) | 200 | 100,000 | N/A | ⚠️ |" >> $GITHUB_STEP_SUMMARY
            fi

            # Resource usage
            H2_AVG_CPU="${{ steps.run-tests.outputs.h2load_avg_cpu }}"
            if [ -n "$H2_AVG_CPU" ] && [ "$H2_AVG_CPU" != "N/A" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> **Resource Usage During Stress Test:** Average CPU: ${H2_AVG_CPU}%" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Test Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Detailed test results are available in the **Artifacts** section:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Functional Tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`functional-results-default.txt\` - Default frontend functional tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`functional-results-api.txt\` - Frontend-API functional tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`functional-results-web.txt\` - Frontend-Web functional tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### HTTP/2 (H2C) Go Client Tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-low-default.txt\` - Low concurrency (default frontend)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-low-api.txt\` - Low concurrency (frontend-api)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-low-web.txt\` - Low concurrency (frontend-web)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-medium-default.txt\` - Medium concurrency (default frontend)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-medium-api.txt\` - Medium concurrency (frontend-api)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-medium-web.txt\` - Medium concurrency (frontend-web)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-high-default.txt\` - High concurrency (default frontend)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-high-api.txt\` - High concurrency (frontend-api)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-high-web.txt\` - High concurrency (frontend-web)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf-high-monitor.csv\` - Resource monitoring during high concurrency test (CPU, Memory, Network, I/O)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### h2load Benchmark Tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`h2load-low-default.txt\` - h2load low load (1K req, 10 clients)" >> $GITHUB_STEP_SUMMARY
          echo "- \`h2load-medium-default.txt\` - h2load medium load (10K req, 50 clients)" >> $GITHUB_STEP_SUMMARY
          echo "- \`h2load-high-default.txt\` - h2load high load (50K req, 100 clients)" >> $GITHUB_STEP_SUMMARY
          echo "- \`h2load-stress-default.txt\` - h2load stress test default frontend (100K req, 200 clients)" >> $GITHUB_STEP_SUMMARY
          echo "- \`h2load-stress-api.txt\` - h2load stress test API frontend (100K req, 200 clients)" >> $GITHUB_STEP_SUMMARY
          echo "- \`h2load-stress-web.txt\` - h2load stress test Web frontend (100K req, 200 clients)" >> $GITHUB_STEP_SUMMARY
          echo "- \`h2load-stress-monitor.csv\` - Resource monitoring during stress test (CPU, Memory, Network, I/O)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ℹ️ Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Runtime:** Podman" >> $GITHUB_STEP_SUMMARY
          echo "- **Go Version:** ${{ env.GO_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** \`${{ github.workflow }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          
          # Cleanup
          podman-compose down -v || true

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const functionalPassed = '${{ steps.run-tests.outputs.functional_tests_passed }}' === 'true';
            const perfLowPassed = '${{ steps.run-tests.outputs.perf_low_passed }}' === 'true';
            const perfMediumPassed = '${{ steps.run-tests.outputs.perf_medium_passed }}' === 'true';
            const perfHttp2Passed = '${{ steps.run-tests.outputs.perf_http2_passed }}' === 'true';
            const dynamicPassed = '${{ steps.run-tests.outputs.dynamic_backend_passed }}' === 'true';

            const allPassed = functionalPassed && perfLowPassed && perfMediumPassed && perfHttp2Passed && dynamicPassed;

            const emoji = allPassed ? '✅' : '❌';
            const status = allPassed ? 'All tests passed!' : 'Some tests failed';

            const body = `## ${emoji} HTTP Gateway Test Results

            **Status:** ${status}

            ### Test Results

            | Test | Result |
            |------|--------|
            | Functional Tests (All Frontends) | ${functionalPassed ? '✅' : '❌'} |
            | HTTP/2 (H2C) - Low (8 workers, all frontends) | ${perfLowPassed ? '✅' : '❌'} |
            | HTTP/2 (H2C) - Medium (16 workers, all frontends) | ${perfMediumPassed ? '✅' : '❌'} |
            | HTTP/2 (H2C) - High (32 workers, all frontends) | ${perfHttp2Passed ? '✅' : '❌'} |
            | Dynamic Backend Updates | ${dynamicPassed ? '✅' : '❌'} |

            ### HTTP/2 (H2C) Performance Metrics

            | Test Level | Frontend | Concurrency | Total Requests | Requests/sec |
            |-----------|:--------:|:-----------:|:--------------:|:------------:|
            | Low | Default | 8 | 2,000 | ${{ steps.run-tests.outputs.perf_low_default_rps }} |
            | Low | API | 8 | 2,000 | ${{ steps.run-tests.outputs.perf_low_api_rps }} |
            | Low | Web | 8 | 2,000 | ${{ steps.run-tests.outputs.perf_low_web_rps }} |
            | Medium | Default | 16 | 20,000 | ${{ steps.run-tests.outputs.perf_medium_default_rps }} |
            | Medium | API | 16 | 20,000 | ${{ steps.run-tests.outputs.perf_medium_api_rps }} |
            | Medium | Web | 16 | 20,000 | ${{ steps.run-tests.outputs.perf_medium_web_rps }} |
            | High | Default | 32 | 100,000 | ${{ steps.run-tests.outputs.perf_high_default_rps }} |
            | High | API | 32 | 100,000 | ${{ steps.run-tests.outputs.perf_high_api_rps }} |
            | High | Web | 32 | 100,000 | ${{ steps.run-tests.outputs.perf_high_web_rps }} |

            > **Note:** All performance tests use HTTP/2 over cleartext (H2C) protocol.

            ### ⚡ h2load HTTP/2 Benchmarks

            | Test Level | Clients | Total Requests | Requests/sec |
            |-----------|:-------:|:--------------:|:------------:|
            | Low | 10 | 1,000 | ${{ steps.run-tests.outputs.h2load_low_rps }} |
            | Medium | 50 | 10,000 | ${{ steps.run-tests.outputs.h2load_medium_rps }} |
            | High | 100 | 50,000 | ${{ steps.run-tests.outputs.h2load_high_rps }} |

            **Stress Test (All Frontends - 200 clients, 100K requests each):**
            - Default: ${{ steps.run-tests.outputs.h2load_stress_default_rps }} req/s
            - API: ${{ steps.run-tests.outputs.h2load_stress_api_rps }} req/s
            - Web: ${{ steps.run-tests.outputs.h2load_stress_web_rps }} req/s

            <details>
            <summary>View detailed test results</summary>

            Test artifacts are available in the workflow run:

            **Functional Tests:**
            - \`functional-results-default.txt\` - Default frontend tests
            - \`functional-results-api.txt\` - Frontend-API tests
            - \`functional-results-web.txt\` - Frontend-Web tests

            **HTTP/2 (H2C) Go Client Tests:**
            - \`perf-low-default.txt\` - Low concurrency (default)
            - \`perf-low-api.txt\` - Low concurrency (API)
            - \`perf-low-web.txt\` - Low concurrency (Web)
            - \`perf-medium-default.txt\` - Medium concurrency (default)
            - \`perf-medium-api.txt\` - Medium concurrency (API)
            - \`perf-medium-web.txt\` - Medium concurrency (Web)
            - \`perf-high-default.txt\` - High concurrency (default)
            - \`perf-high-api.txt\` - High concurrency (API)
            - \`perf-high-web.txt\` - High concurrency (Web)
            - \`perf-high-monitor.csv\` - Resource monitoring during high concurrency test

            **h2load Benchmark Tests:**
            - \`h2load-low-default.txt\` - h2load low load (1K req, 10 clients)
            - \`h2load-medium-default.txt\` - h2load medium load (10K req, 50 clients)
            - \`h2load-high-default.txt\` - h2load high load (50K req, 100 clients)
            - \`h2load-stress-default.txt\` - Stress test default frontend
            - \`h2load-stress-api.txt\` - Stress test API frontend
            - \`h2load-stress-web.txt\` - Stress test Web frontend
            - \`h2load-stress-monitor.csv\` - Resource monitoring (CPU, Memory, Network, I/O)

            **Note:** All tests run on 3 frontends (default on port 8080, frontend-api on port 8081, frontend-web on port 8082)

            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  verify:
    name: Verify Test Results
    needs: integration-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ All HTTP Gateway tests passed successfully!"
            exit 0
          else
            echo "❌ HTTP Gateway tests failed!"
            echo "Please review the test results and fix any issues."
            exit 1
          fi
