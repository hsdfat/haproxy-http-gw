global
    pidfile /tmp/haproxy-gateway/haproxy.pid
    stats socket /tmp/haproxy-gateway/haproxy-runtime-api.sock mode 660 level admin expose-fd listeners
    log stdout format raw local0 debug

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 5s

frontend http-gw
    bind :8080
    mode http
    default_backend default-backend

frontend stats
    bind :9090
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    http-request use-service prometheus-exporter if { path /metrics }

backend default-backend
    mode http
    balance roundrobin
    http-request return status 503 content-type text/plain string "no backends available"

backend eir_be
    mode http
    balance roundrobin
    # Pre-allocated server slots for dynamic updates via runtime socket
    # These slots start in maintenance mode and will be activated when backends register
    server SRV_1 127.0.0.1:1 disabled
    server SRV_2 127.0.0.1:1 disabled
    server SRV_3 127.0.0.1:1 disabled
    server SRV_4 127.0.0.1:1 disabled
    server SRV_5 127.0.0.1:1 disabled
    server SRV_6 127.0.0.1:1 disabled
    server SRV_7 127.0.0.1:1 disabled
    server SRV_8 127.0.0.1:1 disabled
    server SRV_9 127.0.0.1:1 disabled
    server SRV_10 127.0.0.1:1 disabled
